schema_version = 1
evaluator_id = "project-authorization-operation-time-enforcement"
evaluator_version = "1"
taxonomy_version = "2"

[[path_rule]]
pattern = ".githooks/**"
mutation_class = "configuration"

[[path_rule]]
pattern = ".goosehints"
mutation_class = "configuration"

# Baseline path rules (bridge/gtkb-operation-taxonomy-baseline-path-rules, GO at
# -002): the neutral harness baseline and the predecessor tree being retired are
# configuration content; without these rules both evaluate to `unclassified` and
# the operation-time evaluator fails closed on any target_paths containing them.
[[path_rule]]
pattern = ".harness-baseline-configuration/**"
mutation_class = "configuration"

[[path_rule]]
pattern = ".agents/**"
mutation_class = "configuration"

