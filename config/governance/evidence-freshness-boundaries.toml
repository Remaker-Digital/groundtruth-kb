# Evidence freshness and archival-boundary policy for harness-equivalence work.
# Authority: bridge/gtkb-wi4971-evidence-freshness-boundaries-004.md GO.

schema_version = 1
work_item = "WI-4971"
project = "PROJECT-HARNESS-EQUIVALENCE-PHASE-3"
authority_bridge = "bridge/gtkb-wi4971-evidence-freshness-boundaries-004.md"
sot_registry_path = "config/registry/sot-artifacts.toml"

[relationship_to_sot_registry]
mode = "complements_not_supersedes"
duplicate_sot_inventory = false
registry_authority = "GOV-PLATFORM-SOT-REGISTRY-001"
freshness_authority = "GOV-SOURCE-OF-TRUTH-FRESHNESS-001"
read_hook_authority = "DCL-SOT-READ-HOOK-CONTRACT-001"
statement = "This policy classifies evidence references used in harness-equivalence review. It does not register SoT artifacts, replace config/registry/sot-artifacts.toml, or authorize reading forbidden_substitutes."

[freshness]
routine_default_read_mode = "compact"
default_current_max_age_minutes = 60
state_claim_requires_canonical_read = true
declared_ttl_exception_allowed = true
declared_ttl_requires_inline_metadata = true
declared_ttl_requires_canonical_fallback = true
archival_history_is_canonical = true
full_history_default = false
forbidden_substitutes_policy = "deny_for_current_state_claims"

[[evidence_classes]]
id = "current"
description = "Fresh current-state evidence from a canonical reader, including compact output when the compact output is itself produced by the canonical reader."
default_read_mode = "compact"
sufficient_for_current_state = true
requires_canonical_reader = true
allows_declared_ttl_exception = true

[[evidence_classes]]
id = "stale"
description = "Evidence that is too old, lacks freshness metadata, relies on a summary/paraphrase for a state claim, or attempts to substitute a forbidden path."
default_read_mode = "canonical_refresh_required"
sufficient_for_current_state = false
requires_canonical_reader = true

[[evidence_classes]]
id = "archival-citation-only"
description = "Stable historical/audit-trail citation that can be cited as history without loading the full archived payload during routine sessions."
default_read_mode = "citation_only"
sufficient_for_current_state = false
requires_stable_citation = true

[[evidence_classes]]
id = "full-read-justified"
description = "A full archival read is justified by a stated verification, dispute, reproduction, or repair reason and a stable citation."
default_read_mode = "full"
sufficient_for_current_state = false
requires_justification = true
requires_stable_citation = true

[[evidence_classes]]
id = "missing"
description = "The cited evidence cannot be resolved or the provider lane has a typed missing-evidence disposition."
default_read_mode = "none"
sufficient_for_current_state = false
requires_follow_on_disposition = true

[[citation_only_patterns]]
id = "bridge-versioned-file"
pattern = "bridge/*-[0-9][0-9][0-9].md"
rule = "Versioned bridge files are append-only audit history; cite stable versions unless verifying current latest state."

[[citation_only_patterns]]
id = "deliberation-id"
pattern = "DELIB-*"
rule = "Deliberation IDs are stable design-reasoning citations; cite IDs without loading unrelated archive history."

[[full_read_justifications]]
id = "verify-current-claim"
description = "A current-state claim depends on the archived reference and cannot be resolved from a compact canonical reader."

[[full_read_justifications]]
id = "dispute-or-reproduce"
description = "The session must dispute, reproduce, or debug the archived claim itself."

[[full_read_justifications]]
id = "archive-repair"
description = "The archive record is being repaired or migrated under a governed bridge scope."

[[blocker_families]]
id = "B1"
summary = "Bridge scan raw JSON included terminal VERIFIED and archived/nonterminal payloads during routine checks."
evidence_path = "independent-progress-assessments/CODEX-INSIGHT-DROPBOX/session-activity-envelope-sharding-blockers-2026-07-01.md (source retired 2026-07-17)"
boundary_rule = "Use compact current bridge queue reads for routine state; treat terminal/archive payloads as citation-only unless a full-read justification is stated."
evidence_class = "current"

[[blocker_families]]
id = "B2"
summary = "Implementation authorization list output dumped hundreds of expired named packets."
evidence_path = "independent-progress-assessments/CODEX-INSIGHT-DROPBOX/session-activity-envelope-sharding-blockers-2026-07-01.md (source retired 2026-07-17)"
boundary_rule = "Use compact current packet summaries for routine state; expired packet bodies are archival citation-only unless disputed or repaired."
evidence_class = "current"

[[blocker_families]]
id = "B3"
summary = "Implementation-report planning output included broad dirty-worktree and version-chain payloads when only current GO/report metadata was needed."
evidence_path = "independent-progress-assessments/CODEX-INSIGHT-DROPBOX/session-activity-envelope-sharding-blockers-2026-07-01.md (source retired 2026-07-17)"
boundary_rule = "Use compact plan metadata for current implementation planning; load full version chains only when filing or verifying the bridge artifact."
evidence_class = "current"

[[blocker_families]]
id = "B4"
summary = "Handoff/session marker drift and archived-envelope mis-resolution could cause agents to use the wrong archived session state."
evidence_path = "independent-progress-assessments/CODEX-INSIGHT-DROPBOX/session-activity-envelope-sharding-blockers-2026-07-01.md (source retired 2026-07-17)"
boundary_rule = "Explicit session IDs and stable citations justify archive selection; ambiguous archived state fails closed."
evidence_class = "full-read-justified"

[[blocker_families]]
id = "B5"
summary = "Broad generated/cache searches can hit runtime artifacts, wasting tokens and producing access-denied noise."
evidence_path = "independent-progress-assessments/CODEX-INSIGHT-DROPBOX/session-activity-envelope-sharding-blockers-2026-07-01.md (source retired 2026-07-17)"
boundary_rule = "Generated/cache surfaces are not current-state authority; use deterministic inventory/hygiene readers instead of unbounded full-tree searches."
evidence_class = "stale"

[[blocker_families]]
id = "B6"
summary = "Startup glossary/terminology loading risked loading the full glossary into the base session envelope."
evidence_path = "independent-progress-assessments/CODEX-INSIGHT-DROPBOX/session-activity-envelope-sharding-blockers-2026-07-01.md (source retired 2026-07-17)"
boundary_rule = "Base sessions use compact core terminology; activity-specific terms are loaded on demand by the relevant activity envelope."
evidence_class = "current"

[[blocker_families]]
id = "B7"
summary = "Provider harnesses lack full transcript/session archives, creating temptation to rely on synthetic state."
evidence_path = "independent-progress-assessments/CODEX-INSIGHT-DROPBOX/session-activity-envelope-sharding-blockers-2026-07-01.md (source retired 2026-07-17)"
boundary_rule = "Provider lanes use compact-provider projections and typed waivers; missing full transcripts are not replaced by synthetic current-state claims."
evidence_class = "missing"
