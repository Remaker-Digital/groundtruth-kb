# Cross-gate false-positive regression corpus — FAB-14 (HYG-040 / WI-4426).
#
# Each gate ships a deterministic classifier of free-form text. This corpus is the
# shared regression surface: commands/content that must NOT be falsely blocked
# (`*_pass`), plus genuine violations that MUST still be blocked (`*_block`). LO
# verification of any gate-parser change is required to keep this corpus green.
#
# Authority: SPEC-AUQ-NO-LLM-CLASSIFIER-001 (deterministic classifiers),
# SPEC-AUQ-POLICY-ENGINE-001 (gate precision), DCL-CROSS-HARNESS-ENFORCEMENT-001.

schema_version = 1

# --- Root-boundary Bash parser (groundtruth_kb.enforcement.check_bash_command) ---
# HYG-042: the '/word' branch of PATH_DELIMITER_RE mis-read any relative path with
# an internal slash as an out-of-root '/word' absolute, blocking everyday commands.

[[bash_parser_pass]]
command = 'python scripts/implementation_authorization.py begin --bridge-id gtkb-fab-17-da-chroma-read-path'
note = 'relative scripts/... mis-read as out-of-root /implementation_authorization.py (this session)'

[[bash_parser_pass]]
command = 'wc -l bridge/gtkb-example-001.md'
note = 'relative numbered bridge file (this session)'

[[bash_parser_pass]]
command = 'python -m pytest platform_tests/scripts/'
note = 'relative test dir with trailing slash'

[[bash_parser_pass]]
command = 'ruff check groundtruth-kb/src/groundtruth_kb/db.py'
note = 'deeply-nested relative source path'

[[bash_parser_pass]]
command = 'git diff scripts/benchmarks/cli.py'
note = 'relative path argument'

[[bash_parser_pass]]
command = 'cat /dev/null'
note = 'null sink whitelisted'

[[bash_parser_pass]]
command = 'curl https://example.com/api/v1/path'
note = 'URL scheme://... skipped, not a filesystem path'

[[bash_parser_pass]]
command = 'Write-Output "regex Document:\s*(\S+) bridge/gtkb-example-001.md"'
note = 'drive-shaped substring inside regex/prose is not a standalone filesystem token'

[[bash_parser_pass]]
command = 'Write-Output "E:\GT-KB\bridge\gtkb-example-001.md"'
note = 'quoted in-root Windows absolute bridge path is allowed'

[[bash_parser_pass]]
command = 'Write-Output "regex \\-]+\.[\w]+)\b"'
note = 'double backslash in regex pattern should not be treated as a UNC absolute path'

[[bash_parser_pass]]
command = 'echo //some-comment'
note = 'double forward slash in comment should not be treated as a UNC absolute path'

[[bash_parser_pass]]
command = 'type C:\Users\micha\.claude\settings.json'
note = 'allow harness-specific settings files under the user profile directory'

[[bash_parser_pass]]
command = 'gt bridge show gtkb-wi4988-direct-harness-launch-guard'
note = 'bridge status/read command mentions a direct-launch guard thread but does not launch a harness'

[[bash_parser_pass]]
command = 'python scripts/verify_codex_dispatch.py'
note = 'readiness verification script name contains codex but is not a Codex worker launch'

[[bash_parser_pass]]
command = 'rg claude bridge/'
note = 'search command mentions Claude but does not launch Claude Code'

[[bash_parser_pass]]
command = 'Write-Output "claude codex ollama cursor"'
note = 'PowerShell output/prose mentioning harness names is not a launch'

[[bash_parser_block]]
command = 'cat C:\Users\micha\secret.txt'
note = 'genuine out-of-root drive-letter absolute'

[[bash_parser_block]]
command = 'type \\server\share\file'
note = 'genuine UNC path'

[[bash_parser_block]]
command = 'cat /c/Users/micha/secret'
note = 'MSYS /c/ translated to C:\Users\... -> out of root'

[[bash_parser_block]]
command = 'claude -p "review this"'
note = 'direct Claude Code harness launch prohibited by WI-4988'

[[bash_parser_block]]
command = 'claude.exe --version'
note = 'Windows .exe suffix still identifies a direct Claude Code launch'

[[bash_parser_block]]
command = 'codex exec "continue this work"'
note = 'direct Codex headless worker launch prohibited by WI-4988'

[[bash_parser_block]]
command = 'ollama run deepseek-v4-pro:cloud'
note = 'direct Ollama model/harness launch prohibited by WI-4988'

[[bash_parser_block]]
command = 'GTKB_DISPATCHER_MEDIATED=1 claude -p "spoofed"'
note = 'shell-forgeable dispatcher env marker must not bypass direct-launch guard'

[[bash_parser_block]]
command = '$env:GTKB_DISPATCHER_MEDIATED=1; claude -p "spoofed"'
note = 'PowerShell env spoof must not bypass direct-launch guard'

[[bash_parser_block]]
command = 'New-Item .gtkb-state/dispatcher.marker; codex exec "spoofed"'
note = 'marker-file spoof before codex exec must still be denied'

[[bash_parser_block]]
command = '& claude -p "powershell call operator"'
note = 'PowerShell call operator form of direct Claude launch'

[[bash_parser_block]]
command = 'Start-Process claude -ArgumentList "-p review"'
note = 'PowerShell Start-Process direct Claude launch'

[[bash_parser_block]]
command = 'Start-Process -FilePath codex -ArgumentList "exec review"'
note = 'PowerShell Start-Process direct Codex exec launch'

[[bash_parser_block]]
command = 'python scripts/ollama_harness.py --prompt review'
note = 'project harness shim direct launch prohibited by WI-4988'

# --- Cross-harness directive surfaces (FAB-14 re-scope) ---

[[powershell_parser_pass]]
command = 'Get-Content bridge/gtkb-example-001.md'
note = 'Claude PowerShell matcher routes command text through the same root-boundary parser without false-blocking in-root relative paths'

[[codex_apply_patch_pass]]
path = 'bridge/gtkb-example-001.md'
note = 'Codex apply_patch adapter treats in-root patch targets as allowed'

[[codex_apply_patch_pass]]
path = 'C:\Users\micha\.codex\skills\some-skill\SKILL.md'
note = 'Codex apply_patch allows path under local harness-specific directory'

[[codex_apply_patch_block]]
path = 'C:\Users\micha\secret.txt'
note = 'Codex apply_patch adapter still blocks genuine out-of-root absolute paths'
