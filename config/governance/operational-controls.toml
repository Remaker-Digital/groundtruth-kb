[[controls]]
id = "registry.git_probe_seconds"
description = "Socket-independent subprocess timeout for Git checkout identity lookup."
numeric_kind = "decimal"
unit = "seconds"
value = "10"
minimum = "0.001"
maximum = "3600"
category = "timeout"
scope = "per_operation"
zero_semantics = "forbidden"
rationale = "Measured 2026-09-17 (calibration:2026-09-17:runtime-control-calibration): 299 probes with the product argv on a checkout whose packs total 8.5 GiB; idle median 0.037 s, parallel-8 max 0.070 s, and one probe of 2.78 s (28% of this bound) while 16 writers started concurrently; none reached the bound. Kept at 10 s: the long tail under process-start contention is about 76x the median and must be absorbed; no measured basis to tighten."
tolerance_rationale = "Positive bounded waits/backoff avoid unbounded waits and busy retry loops. Coupled backoff and jitter relations are validated together; the wait does not bound the complete registry operation."
migration_state = "active"
consumers = ["groundtruth_kb.project.registry_control_plane"]
evidence_refs = ["DCL-CENTRAL-DYNAMIC-OPERATIONAL-CONTROLS-001", "GOV-PLATFORM-SOT-REGISTRY-001", "calibration:2026-09-17:runtime-control-calibration"]
reload_behavior = "next_operation"
failure_disposition = "refuse_new_operation"
observability = ["control_catalog_sha256", "RegistryFileLockAcquisitionTimeout"]

[[controls]]
id = "inventory.git_probe_seconds"
description = "Maximum duration of the optional local Git revision probe performed by one inventory operation."
numeric_kind = "decimal"
unit = "seconds"
value = "30"
minimum = "0.001"
maximum = "3600"
category = "timeout"
scope = "per_operation"
zero_semantics = "forbidden"
rationale = "Measured 2026-09-17 (calibration:2026-09-17:runtime-control-calibration): 81 probes with the product argv on the same 8.5 GiB object store; idle median 0.037 s, parallel-8 max 0.075 s; the worst same-binary tail seen in the campaign (2.78 s) is 9% of this bound; none reached it. Kept at 30 s: the probe runs once per inventory operation, so the relaxed posture costs nothing when healthy and bounds a stalled probe visibly."
tolerance_rationale = "A stalled metadata subprocess must not make inventory generation wait indefinitely. Missing metadata remains explicit and does not invent a revision."
migration_state = "active"
consumers = ["scripts.timer_inventory"]
evidence_refs = ["DCL-CENTRAL-DYNAMIC-OPERATIONAL-CONTROLS-001", "WI-5804", "calibration:2026-09-17:runtime-control-calibration"]
reload_behavior = "next_operation"
failure_disposition = "refuse_new_operation"
observability = ["catalog_sha256", "generating_commit", "git_metadata_unavailable"]
