# Canonical live operational values. New operations read one validated snapshot.
# Environment overrides and source fallbacks are not value authorities.
# Declared: the registry writer controls and the inventory Git probe, each measured on 2026-09-17
# (calibration:2026-09-17:runtime-control-calibration). Migration of the remaining production literals is PROJECT-GTKB-TIMER-GOVERNANCE.
schema_version = 2

[[controls]]
id = "registry.lock.acquire_seconds"
description = "Maximum acquisition wait after locating the checkout mutex."
numeric_kind = "decimal"
unit = "seconds"
value = "300"
minimum = "0.001"
maximum = "3600"
category = "timeout"
scope = "per_operation"
zero_semantics = "forbidden"
rationale = "Measured 2026-09-17 (calibration:2026-09-17:runtime-control-calibration): 218 contended acquisitions by real registry writers at widths 2/4/8/16 on one host, none reached this budget; worst wait 152.2 s (51%) at sustained width 16 with a 1.5 s median hold; hand-off is unfair, so the tail scales with sustained width and critical-section length. Kept at 300 s: no measured basis to tighten (calibration policy 2/3) and no timeout to justify relaxing; single-machine width is not the nine-harness width."
tolerance_rationale = "Positive bounded waits/backoff avoid unbounded waits and busy retry loops. Coupled backoff and jitter relations are validated together; the wait does not bound the complete registry operation."
migration_state = "active"
consumers = ["groundtruth_kb.project.registry_control_plane"]
evidence_refs = ["DCL-CENTRAL-DYNAMIC-OPERATIONAL-CONTROLS-001", "GOV-PLATFORM-SOT-REGISTRY-001", "calibration:2026-09-17:runtime-control-calibration"]
reload_behavior = "next_operation"
failure_disposition = "refuse_new_operation"
observability = ["control_catalog_sha256", "RegistryFileLockAcquisitionTimeout"]

