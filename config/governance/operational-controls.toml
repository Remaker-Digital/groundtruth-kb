# Canonical live operational values. New operations read one validated snapshot.
# Environment overrides and source fallbacks are not value authorities.
# This migration covers registry writer controls. Other consumers and calibration remain open.
schema_version = 2

[[controls]]
id = "registry.lock.acquire_seconds"
description = "Maximum acquisition wait after locating the checkout mutex."
numeric_kind = "decimal"
unit = "seconds"
value = "300"
minimum = "0.001"
maximum = "3600"
category = "timeout"
scope = "per_operation"
zero_semantics = "forbidden"
rationale = "Preserve the existing registry operating value during source consolidation. Current migration is not proof of optimal calibration."
tolerance_rationale = "Positive bounded waits/backoff avoid unbounded waits and busy retry loops. Coupled backoff and jitter relations are validated together; the wait does not bound the complete registry operation."
migration_state = "active"
consumers = ["groundtruth_kb.project.registry_control_plane"]
evidence_refs = ["DCL-CENTRAL-DYNAMIC-OPERATIONAL-CONTROLS-001", "GOV-PLATFORM-SOT-REGISTRY-001", "WI-5869"]
reload_behavior = "next_operation"
failure_disposition = "refuse_new_operation"
observability = ["control_catalog_sha256", "RegistryFileLockAcquisitionTimeout"]

