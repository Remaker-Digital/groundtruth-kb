[[controls]]
id = "registry.lock.max_backoff_seconds"
description = "Maximum acquisition retry backoff before jitter and remaining-budget clipping."
numeric_kind = "decimal"
unit = "seconds"
value = "1"
minimum = "0.001"
maximum = "3600"
category = "retry_schedule"
scope = "per_operation"
zero_semantics = "forbidden"
rationale = "Measured 2026-09-17 (calibration:2026-09-17:runtime-control-calibration): 4,411 backoff sleeps never exceeded the 1 s cap (max 0.9998 s); idle after a release stayed below cap x jitter_max (max 0.671 s); 26 polls per acquisition on average at sustained width 16 (max 206). Kept at 1 s: a lower cap raises the poll rate on the shared mutex, a higher one lengthens post-release idle; neither is indicated."
tolerance_rationale = "Positive bounded waits/backoff avoid unbounded waits and busy retry loops. Coupled backoff and jitter relations are validated together; the wait does not bound the complete registry operation."
