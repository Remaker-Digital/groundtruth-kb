# Synthetic allowlist of the pre-commit secret scan (scripts/scan_secrets.py).
#
# Each entry attests one exact line as synthetic: `path` is the repository path and
# `line_sha256` the SHA-256 of that line's exact text (UTF-8, no line terminator; the
# same for an LF index blob and a CRLF working copy). The gate reports a finding with
# that identity as "allowlisted (synthetic)" and does not fail on it. Any byte change to
# the line invalidates the entry: the finding is reported again and the entry is
# reported as stale, which fails the gate until it is corrected or removed. Entries are
# never matched by value or by line number, so no other line and no other file is
# covered. Only lines whose finding would refuse a commit (candidate-high) are attested;
# candidate-medium findings are reported and never refuse, so they are not listed here.
# Do not list generated outputs here; a generated file leaves the tree instead.
#
# To attest a new synthetic line: python -c "import hashlib,sys;print(hashlib.sha256(sys.stdin.readline().rstrip('\r\n').encode()).hexdigest())"
# with the exact line on stdin, then add an entry with a rationale that states why the
# text is not a credential (do not repeat the flagged text in the rationale).
#
# Origin: increment c94 secrets-scan-allowlist (2026-09-17): the two candidate-high lines of
# the commit refusal of 2026-09-17 10:41 and the three latent candidate-high lines of the
# same kind in groundtruth-kb/tests/test_deliberations.py.

