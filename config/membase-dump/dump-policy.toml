# MemBase committable dump — table selection policy (WI-6218)
#
# Authority: bridge/gtkb-wi6218-membase-committable-dump-005.md (GO at -006).
# Consumed by scripts/membase_dump.py.
#
# Selection lives here rather than in the dumper so that what gets projected
# into git is reviewable and diffable on its own. The dumper carries no literal
# list of table names.
#
# The classification is EXHAUSTIVE and CLOSED. A table present in the database
# but named in neither set is a hard error, not a default. That is deliberate:
# schema growth must not silently enter the projection (which is how the
# 868 MB whole-database figure arises) nor silently escape it (which would lose
# governed content without anyone deciding to).
#
# Views are not classified. They are derived objects, recreated by the
# platform's own schema initialization, which is already tracked in git.
#
# (c) 2026 Remaker Digital, a DBA of VanDusen & Palmeter, LLC. All rights reserved.

schema_version = 1

# ---------------------------------------------------------------------------
# Size budgets
# ---------------------------------------------------------------------------
# max_file_bytes is 25 MiB: comfortably under the 100 MiB hard limit that made
# `develop` unpushable (WI-6138), with headroom for rows inside an existing
# chunk range getting wider over time. The dumper refuses to write an artifact
# over this size rather than emitting it.
#
# max_total_bytes bounds the whole projection so that widening the include set
# carelessly fails loudly instead of quietly re-creating the object-store
# problem that WI-5431 tracks.
[budget]
max_file_bytes = 26_214_400
max_total_bytes = 262_144_000
default_rows_per_chunk = 20_000

# ---------------------------------------------------------------------------
# Included — governed content
# ---------------------------------------------------------------------------
# Specifications, work items, deliberations, documents, project records, the
# test corpus, procedures, environment configuration, session handoffs, the
# registry artifacts, and the linkage tables that join them. This is the
# content a clone must be able to reconstruct.
[include]
tables = [
  "agent_capability_snapshots",
  "backlog_snapshots",
  "canonical_terms",
  "deliberation_specs",
  "deliberation_work_items",
  "deliberations",
  "documents",
  "environment_config",
  "flow_artifacts",
  "flow_definitions",
  "flow_instances",
  "harnesses",
  "operational_procedures",
  "project_artifact_links",
  "project_dependencies",
  "project_work_item_memberships",
  "projects",
  "session_prompts",
  "session_role_attestations",
  "sot_artifacts",
  "sot_quarantine_receipts",
  "sot_registry_bridge_recovery_receipts",
  "sot_registry_transition_requests",
  "specification_deliberation_sources",
  "specifications",
  "test_coverage",
  "test_plan_phases",
  "test_plans",
  "test_procedures",
  "testable_elements",
  "tests",
  "work_items",
]

# Rows per chunk, for tables whose rows are wide enough that the default span
# would approach the per-file budget. A chunk covers a FIXED span of the rowid
# space, so these values change chunk boundaries: raising or lowering one
# rewrites that table's whole projection once, then returns to tail-only churn.
#
# Sizing rule: pick a span such that (measured average row width x span) is at
# most ~10 MB, i.e. under half the per-file budget. The remaining headroom
# absorbs rows inside an already-established span getting wider over time,
# which is the only way an existing chunk can grow. Entries below were set from
# widths measured against the live database on 2026-08-14; a table absent from
# this list is one whose full default span still fits comfortably.
[include.rows_per_chunk]
deliberations = 1_000                          # ~9.3 kB/row
session_prompts = 1_000                        # ~5.8 kB/row
sot_registry_bridge_recovery_receipts = 1_000  # ~6.6 kB/row
sot_registry_transition_requests = 500         # ~14.3 kB/row
documents = 100                                # ~12.7 kB/row
backlog_snapshots = 100                        # ~4.2 kB/row
operational_procedures = 500                   # ~2.0 kB/row
test_plan_phases = 2_500                       # ~2.6 kB/row
sot_artifacts = 2_000                          # ~0.9 kB/row
work_items = 4_000                             # ~2.0 kB/row
specifications = 5_000                         # ~1.2 kB/row
projects = 8_000                               # ~1.1 kB/row
canonical_terms = 8_000                        # ~1.1 kB/row
tests = 10_000                                 # ~0.7 kB/row
project_artifact_links = 10_000                # ~0.9 kB/row
harnesses = 10_000                             # ~0.8 kB/row
flow_instances = 10_000                        # ~0.8 kB/row

# ---------------------------------------------------------------------------
# Excluded — runtime telemetry and derived or rebuildable state
# ---------------------------------------------------------------------------
# Every exclusion records why the table is not governed content and whether its
# contents can be recovered elsewhere. Three entries are NOT recoverable and
# are accepted as non-durable; that is a real narrowing of durability and is
# stated rather than glossed. Moving any row into [include].tables above needs
# no design change — the sharding absorbs it.

[[exclude]]
table = "pipeline_events"
reason = "Runtime telemetry. 1.67 M rows, ~644 MB of dump text — 74% of the whole-database total on its own — and carries no governance decision."
recoverable = false
recovery = "Accepted as non-durable."

[[exclude]]
table = "assertion_runs"
reason = "Assertion execution history (~105 K rows, ~22 MB). Evidence of runs, not a governed record."
recoverable = true
recovery = "Regenerated by re-running the assertion suite."

[[exclude]]
table = "sot_registry_transaction_journal"
reason = "Registry transaction payloads: 18 rows averaging 746 KB each, ~13 MB. Large embedded payloads rather than row volume."
recoverable = false
recovery = "Accepted as non-durable; the resulting registry state is projected via sot_artifacts."

[[exclude]]
table = "sot_registry_bridge_publication_capabilities"
reason = "Derived publication-capability cache (~2.3 K rows, ~29 MB)."
recoverable = true
recovery = "Recomputed by republication."

[[exclude]]
table = "sot_artifact_revisions"
reason = "Revision history of registry artifacts (~6.9 K rows, ~12 MB). The current revision of each artifact is projected via sot_artifacts."
recoverable = false
recovery = "Accepted as non-durable."

[[exclude]]
table = "sot_registry_observation_capabilities"
reason = "Derived observation-capability cache; peer of the excluded publication-capability cache."
recoverable = true
recovery = "Recomputed from the registry."

[[exclude]]
table = "dispatch_events"
reason = "Bridge dispatch runtime telemetry."
recoverable = false
recovery = "Accepted as non-durable; dispatch decisions that matter are recorded in bridge files."

[[exclude]]
table = "dispatch_default_metric_events"
reason = "Dispatch metric telemetry."
recoverable = false
recovery = "Accepted as non-durable."

[[exclude]]
table = "dispatch_default_metrics_snapshots"
reason = "Derived rollup of dispatch metric telemetry."
recoverable = true
recovery = "Recomputed from the metric source when that source exists."

[[exclude]]
table = "dispatch_lanes"
reason = "Derived dispatch-lane projection built from the harness registry and dispatcher rules."
recoverable = true
recovery = "Recomputed by re-projecting the dispatcher configuration."

[[exclude]]
table = "dispatch_lane_matrix"
reason = "Derived dispatch-lane projection."
recoverable = true
recovery = "Recomputed by re-projecting the dispatcher configuration."

[[exclude]]
table = "dispatch_lane_projection_metadata"
reason = "Metadata about a derived dispatch-lane projection run."
recoverable = true
recovery = "Recomputed by re-projecting the dispatcher configuration."

[[exclude]]
table = "dispatch_lane_projection_snapshots"
reason = "Point-in-time copies of a derived dispatch-lane projection."
recoverable = true
recovery = "Recomputed by re-projecting the dispatcher configuration."

[[exclude]]
table = "dispatch_lane_score_dimensions"
reason = "Derived dispatch-lane scoring input."
recoverable = true
recovery = "Recomputed by re-projecting the dispatcher configuration."

[[exclude]]
table = "dispatch_lane_score_snapshots"
reason = "Derived dispatch-lane scoring output."
recoverable = true
recovery = "Recomputed by re-projecting the dispatcher configuration."

[[exclude]]
table = "dispatch_lane_scoring_evidence"
reason = "Derived dispatch-lane scoring evidence."
recoverable = true
recovery = "Recomputed by re-projecting the dispatcher configuration."

[[exclude]]
table = "flow_events"
reason = "Flow-execution runtime telemetry. The durable flow records are projected via flow_definitions, flow_instances, and flow_artifacts."
recoverable = false
recovery = "Accepted as non-durable."

[[exclude]]
table = "stage_instances"
reason = "Flow-stage runtime execution state."
recoverable = false
recovery = "Accepted as non-durable; the artifacts a stage produced are projected via flow_artifacts."

[[exclude]]
table = "stage_attempt_telemetry"
reason = "Flow-stage attempt telemetry."
recoverable = false
recovery = "Accepted as non-durable."

[[exclude]]
table = "stage_leases"
reason = "Short-lived flow-stage leases."
recoverable = true
recovery = "Leases are ephemeral and re-acquired by the next run."

[[exclude]]
table = "work_intent_claims"
reason = "Short-TTL bridge work-intent claim leases."
recoverable = true
recovery = "Re-acquired per session; expired claims carry no standing authority."

[[exclude]]
table = "session_init_bindings"
reason = "Per-session runtime init binding."
recoverable = true
recovery = "Re-established at session start."

[[exclude]]
table = "session_snapshots"
reason = "Per-session runtime cache."
recoverable = true
recovery = "Regenerated at session start."

[[exclude]]
table = "quality_scores"
reason = "Derived quality scoring."
recoverable = true
recovery = "Recomputed by re-running the scorer."

[[exclude]]
table = "spec_quality_scores"
reason = "Derived per-specification quality scoring."
recoverable = true
recovery = "Recomputed by re-running the scorer."

[[exclude]]
table = "sqlite_sequence"
reason = "SQLite-internal AUTOINCREMENT counters, not project data."
recoverable = true
recovery = "Maintained automatically by SQLite as rows are inserted."
