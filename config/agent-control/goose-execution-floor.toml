# Goose execution reliability floor configuration
# Schema version tracks the shape of this file so consumers can detect drift.
schema_version = 1

[write_verification]
enabled = true
# Goose tool names that perform file writes. The guard inspects tool-request/
# tool-response pairs matching these names for write-claim reconciliation.
write_tool_names = ["write", "write_file", "create_file", "Write", "Edit"]
# Files that are intentionally zero bytes and should not be flagged as
# zero-byte write failures.
intentional_empty_allowlist = [
    ".gitkeep",
    "__init__.py",
    ".gtkb-state/empty",
    "MANIFEST.json",
]

[leak_detection]
# Pattern classes for tool-call leak detection. Each class is a named regex
# pattern that matches tool-call text serialized into assistant prose.
# Default: all disabled patterns produce explicit failure (exit non-zero).
retry_attempts = 0
retry_backoff_seconds = 0

[leak_detection.patterns]
# DeepSeek DSML tool-call markers
dsml_marker = '(?i)<\s*(?:tool_call|function_call|invoke|DSML)'
# Text-form tool-call envelopes (GLM class)
text_form_envelope = '(?i)(?:tool_call|function_call|tool_use|call_tool)\s*[\(\[:{]'
# Raw function-call or JSON tool envelopes rendered as prose (Qwen class)
raw_tool_call_text = '(?i)\{\s*"(?:name|function|tool_name|tool)"\s*:'

[provenance_guard]
enabled = true
# Scope of bridge files to scan for provenance drift.
# "run_window" = files under bridge/ created/modified within the run window
scan_scope = "run_window"

[cross_cutting]
# Timer discipline per DELIB-202667722: every bound is a configuration value.
# The guard module and wrapper diff contain zero new inline timeout, interval,
# retry, or throttle literals.