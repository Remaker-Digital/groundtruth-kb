forbidden_roots = ["applications", "archive", "archives", "bridge", "retired"]
require_exact_plan_paths = true
allow_globs_at_apply = false

[encoding]
decode_order = ["bom", "python_pep263", "utf-8", "declared_legacy"]
preserve_bom = true
preserve_codec = true
preserve_unrelated_bytes = true
canonical_hook_eol = "LF"
rule_projection_eol = "canonical_source"

[residuals]
required_fields = ["mapping_id", "variant", "classification", "path", "location", "load_bearing", "exception_id", "evidence"]
unresolved_live_blocks_apply = true
history_is_observed_not_rewritten = true
application_boundary_is_observed_not_rewritten = true

[verification]
