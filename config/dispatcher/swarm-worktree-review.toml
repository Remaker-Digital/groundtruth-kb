schema_version = 1
enabled = false
mode = "planning_only"
worktree_creation_allowed = false
agent_spawn_allowed = false
harness_invocation_allowed = false
bridge_bypass_allowed = false
git_mutation_allowed = false

[defaults]
root_boundary = "E:/GT-KB"
required_review_status = "VERIFIED"
required_bridge_sequence = ["NEW", "GO", "implementation_report", "VERIFIED"]

[[lanes]]
name = "implementation"
enabled = false
isolated_worktree_required = true
artifact_outputs = ["diff_summary", "test_log", "bridge_report"]

[[lanes]]
name = "review"
enabled = false
isolated_worktree_required = true
artifact_outputs = ["review_findings", "verdict_candidate", "waiver_notes"]

[[review_routes]]
name = "cross_vendor_primary"
primary_vendor = "codex"
reviewer_vendor = "antigravity"
cross_vendor_required = true
typed_waiver_required = true

[[review_routes]]
name = "same_vendor_exception"
primary_vendor = "any"
reviewer_vendor = "same"
cross_vendor_required = false
typed_waiver_required = true

[[approval_gates]]
name = "worktree_orchestration"
required_before = "git_worktree_creation"
owner_decision_required = true

[[approval_gates]]
name = "agent_spawn"
required_before = "harness_invocation"
owner_decision_required = true

[[approval_gates]]
name = "finalization_route"
required_before = "automated_finalization"
owner_decision_required = true
