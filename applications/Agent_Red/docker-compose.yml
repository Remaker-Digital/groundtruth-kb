# Agent Red application-local development stack.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-red-api
    ports:
      - "8080:8000"
    volumes:
      - ./src:/app/src:ro
    env_file:
      - path: .env.local
        required: false
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - USE_AZURE_OPENAI=false
      - USE_REAL_APIS=false
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-red-net

  test-host:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: agent-red-test-host
    ports:
      - "8001:8001"
    env_file:
      - path: .env.local
        required: false
    environment:
      - TEST_HOST_URL=http://agent-red-test-host:8001
    networks:
      - agent-red-net

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: >
      -js
      --store_dir /data
      --max_payload 1048576
      --http_port 8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - agent-red-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - agent-red-net

volumes:
  nats-data:
    driver: local

networks:
  agent-red-net:
    driver: bridge
    name: agent-red-network
