# GroundTruth CI — Minimal test workflow (local-only profile)
# Runs ruff linting on every push and PR. Specification assertions run where
# the GT-KB authority is reachable (gt --config groundtruth.toml assert), not on
# a hosted runner. No Docker, pytest, mypy, or coverage steps.
#
# Generated by: gt project init --profile local-only

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python {{PYTHON_VERSION}}
        uses: actions/setup-python@v5
        with:
          python-version: "{{PYTHON_VERSION}}"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

      # Specification assertions need the private GT-KB authority:
      #   gt --config groundtruth.toml assert
