# GroundTruth CI — Deploy workflow (dual-agent-webapp profile)
# Deploys a built container image to staging or production.
# Triggered manually via workflow_dispatch with environment selection.
#
# Generated by: gt project init --profile dual-agent-webapp

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image tag to deploy (e.g., 1.0.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify image exists
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          echo "Target: ${{ inputs.environment }}"

      # --- Replace this section with your cloud provider's deployment ---
      # Example: Azure Container Apps
      # - name: Azure Login
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}
      #
      # - name: Deploy to Container Apps
      #   uses: azure/container-apps-deploy-action@v1
      #   with:
      #     containerAppName: my-app-${{ inputs.environment }}
      #     resourceGroup: my-resource-group
      #     imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
      # ---

      # Post-deploy specification assertions need the private GT-KB authority;
      # run them from a workstation that can reach it:
      #   gt --config groundtruth.toml assert
      - name: Record the deployed image
        run: echo "Deployed ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} to ${{ inputs.environment }}"
