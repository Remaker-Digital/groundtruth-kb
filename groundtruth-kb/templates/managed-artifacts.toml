# Managed artifact metadata for authored sources and native registrations.
# M15: four paired authored hooks remain; the projector owns registration derivation.
# Hook template_path equals target_path and denotes the authored source identity.
# No third hook/rule/skill copy is scaffolded or compared.
# Protected-effect checks are supplied by manifest.toml -> scripts/implementation_start_gate.py.

[[artifacts]]
class = "hook"
id = "hook.destructive-gate"
template_path = ".harness-baseline-configuration/hooks/destructive-gate.py"
target_path = ".harness-baseline-configuration/hooks/destructive-gate.py"
initial_profiles = ["local-only", "dual-agent", "dual-agent-webapp"]
managed_profiles = ["dual-agent", "dual-agent-webapp"]
doctor_required_profiles = ["dual-agent", "dual-agent-webapp"]
ownership = "gt-kb-managed"
upgrade_policy = "overwrite"
adopter_divergence_policy = "warn"
notes = "PreToolUse destructive-op gate; product-managed framework safety policy."

