[activities.spec.classification]
skills = "activity_only"
terminology = "activity_only"
history_state = "explicit_query"
direction = "activity_only"

[activities.spec.direction]
stance = "capture-before-implement"
guardrails = [
    "no implementation before specifications are recorded and linked",
