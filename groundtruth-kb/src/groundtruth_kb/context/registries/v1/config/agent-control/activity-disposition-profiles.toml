schema_version = 1
# Activity disposition profiles per DCL-ACTIVITY-DISPOSITION-PROFILE-001.
# headless_eligibility values per DELIB-20265287 D4:
#   spec/build/test = "headless_eligible"
#   deliberation/project = "interactive_only"
#   ops = "interactive_primary"
# Substantive per-activity content refinement is deferred to WI-4730 (owner-driven AUQ).

[activities.ops]
version = 1
headless_eligibility = "interactive_primary"
skills = [
    "open-items",
    "codex-report",
    "gtkb-hygiene-investigation",
    "gtkb-hygiene-reclaim",
    "kb-assert",
]
terminology = [
    "deployed application",
    "hosted application",
    "release",
    "incident",
    "rollback",
    "platform",
    "doctor",
    "dashboard",
    "hygiene reclaim",
    "deep clean",
]

[activities.ops.history_state]
sources = [
    "recent operational incidents",
    "bridge queue health",
    "doctor check results",
    "release blockers",
    "active deployment artifacts",
    "hygiene reclaim history",
]

[activities.ops.classification]
skills = "activity_only"
terminology = "activity_only"
history_state = "explicit_query"
direction = "activity_only"

[activities.ops.direction]
stance = "triage-and-stabilize"
guardrails = [
    "no unreviewed implementations",
    "surface blockers to owner via AUQ before acting on release-gating items",
    "prefer read-only investigation in headless mode",
    "ops-envelope deep cleaning uses the production gt hygiene reclaim deep-clean CLI and does not require per-batch owner interaction once exact ops evidence and quiescence evidence are present",
    "hygiene reclaim skills are ops-envelope-only and must not be used from the global baseline or another activity envelope",
]
manipulates = [
    "bridge state",
    "operational artifacts",
    "doctor reports",
    "release evidence",
    "hygiene reclaim ledgers",
    "receipted hygiene trash payloads",
]

[activities.deliberation]
version = 1
headless_eligibility = "interactive_only"
skills = [
    "grill-me-for-clarification",
    "decision-capture",
    "spec-intake",
    "kb-spec",
    "advisory-proposal",
]
terminology = [
    "requirement",
    "specification",
    "deliberation",
    "Deliberation Archive",
    "owner decision",
    "AskUserQuestion",
    "specification language",
    "Advisory Proposal",
    "ADVISORY bridge entry",
    "governed advisory intake/disposition",
    "CODEX-INSIGHT-DROPBOX",
]

[activities.deliberation.history_state]
sources = [
    "prior deliberations on the topic",
    "pending owner decisions",
    "related specifications",
    "open AUQ items",
    "ADVISORY bridge artifacts from bridge/TAFE/dispatcher status surfaces",
    "status-bearing versioned files under bridge/",
    "non-canonical session evidence from CODEX-INSIGHT-DROPBOX and independent-progress-assessments",
]

[activities.deliberation.classification]
skills = "activity_only"
terminology = "activity_only"
history_state = "explicit_query"
direction = "activity_only"

[activities.deliberation.direction]
stance = "capture-and-clarify"
guardrails = [
    "do not implement during a deliberation session",
    "every owner decision must go through AskUserQuestion",
    "surface candidate specifications before proposing bridge work",
    "Advisory Proposals are governed bridge artifacts, not dropbox notes",
    "ADVISORY entries are non-dispatchable and not implementation approval",
    "Advisory Proposal is the primary Loyal Opposition mechanism for future-work initiation",
    "interactive workers progress advisories through governed advisory intake/disposition",
    "CODEX-INSIGHT-DROPBOX and independent-progress-assessments dropbox files are non-canonical session evidence only",
]
manipulates = [
    "Deliberation Archive records",
    "candidate specifications",
    "pending owner decisions log",
    "Advisory Proposal dispositions",
]

[activities.build]
version = 1
headless_eligibility = "headless_eligible"
skills = [
    "bridge",
    "bridge-propose",
    "verify",
    "kb-work-item",
    "kb-spec",
    "advisory-intake",
]
terminology = [
    "implementation proposal",
    "implementation report",
    "work item",
    "backlog",
    "bridge",
    "bridge queue",
    "GO",
    "NO-GO",
    "VERIFIED",
    "target_paths",
    "Advisory Proposal",
    "ADVISORY bridge entry",
    "advisory intake/disposition",
    "bridge/TAFE/dispatcher status surfaces",
    "CODEX-INSIGHT-DROPBOX",
]

[activities.build.history_state]
sources = [
    "GO'd bridge proposals",
    "authorized parent project records",
    "recent implementation commits",
    "backlog priority order",
    "open NO-GO items",
    "ADVISORY bridge artifacts from bridge/TAFE/dispatcher status surfaces",
    "status-bearing versioned files under bridge/",
    "non-canonical session evidence from CODEX-INSIGHT-DROPBOX and independent-progress-assessments",
]

[activities.build.classification]
skills = "activity_only"
terminology = "activity_only"
history_state = "explicit_query"
direction = "activity_only"

[activities.build.direction]
stance = "implement-within-scope"
guardrails = [
    "no implementation without a GO'd bridge proposal",
    "honor an explicit current-owner backlog or bridge-queue resource term before activity, startup, history, notes, or conjecture",
    "bridge, TAFE, harness, and bridge-related topic qualifiers alone do not select the bridge queue",
    "the file bridge is the protected-change gate for selected backlog work, not a replacement for the backlog resource",
    "stay within target_paths declared in the proposal",
    "run ruff check and ruff format --check before filing an implementation report",
    "acquire work-intent claim before drafting",
    "Advisory Proposals are governed bridge artifacts available through the bridge",
    "ADVISORY entries are non-dispatchable and not implementation approval",
    "Advisory Proposal is the primary Loyal Opposition mechanism for future-work initiation",
    "interactive workers retrieve and progress advisories through governed advisory intake/disposition",
    "CODEX-INSIGHT-DROPBOX and independent-progress-assessments dropbox files are non-canonical session evidence only",
]
manipulates = [
    "source files",
    "test files",
    "configuration files",
    "bridge implementation reports",
    "MemBase work items",
    "Advisory Proposal conversion proposals",
]

[activities.test]
version = 1
headless_eligibility = "headless_eligible"
skills = [
    "verify",
    "kb-assert",
    "gtkb-benchmarks",
    "assertion-triage",
]
terminology = [
    "test",
    "assertion",
    "VERIFIED",
    "verification",
    "spec-to-test mapping",
    "assertion run",
    "assertion category",
    "genuine_drift",
]

[activities.test.history_state]
sources = [
    "failing assertions",
    "recent assertion runs",
    "test coverage gaps",
    "chronic_noise and genuine_drift categories",
    "implementation reports awaiting verification",
]

[activities.test.classification]
skills = "activity_only"
terminology = "activity_only"
history_state = "explicit_query"
direction = "activity_only"

[activities.test.direction]
stance = "verify-evidence-first"
guardrails = [
    "do not modify source during a test activity",
    "a VERIFIED verdict requires executed tests derived from linked specifications",
    "no self-review: reviewer session must differ from author session",
]
manipulates = [
    "test artifacts",
    "assertion run records",
    "VERIFIED bridge verdicts",
    "coverage evidence",
]

[activities.spec]
version = 1
headless_eligibility = "headless_eligible"
skills = [
    "spec-intake",
    "kb-spec",
    "decision-capture",
    "kb-work-item",
]
terminology = [
    "specification",
    "requirement",
