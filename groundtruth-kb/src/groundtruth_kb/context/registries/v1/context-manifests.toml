schema_version = 1

[manifest]
version = 1
categories = [
  "glossary",
  "skills",
  "cli",
  "source_of_truth",
  "project_and_backlog",
  "operating_context",
  "work_subject",
]
activities = ["ops", "deliberation", "build", "test", "spec", "project"]
layers = ["session_baseline", "role_bootstrap", "activity_overlay"]
soft_token_budget = 100000
hard_token_budget = 200000

[resource_contract]
schema_version = 1
precedence = "current_owner_literal > dispatch_provenance > activity_or_startup_default > prior_context_or_notes > conjecture"
no_inference = true
topic_qualifiers = ["bridge", "bridge work", "bridge-related", "TAFE", "harness", "harness-related"]

[resource_contract.resources.backlog]
canonical_term = "backlog"
accepted_terms = ["backlog", "standing backlog", "active backlog", "current backlog", "work list", "known work"]
authority = "MemBase current_work_items"
read_route = "gt backlog list"
non_alias = "bridge_queue"

[resource_contract.resources.bridge_queue]
canonical_term = "bridge queue"
accepted_terms = ["bridge queue", "review queue"]
authority = "TAFE/dispatcher bridge state plus status-bearing numbered files under bridge/"
read_route = "gt bridge state-report"
non_alias = "backlog"

[[items]]
id = "baseline.glossary"
layer = "session_baseline"
category = "glossary"
source_id = "canonical-terms-sync"
source_path = "config/governance/canonical-terms-sync.toml"
authority_class = "governed_registry"
lifecycle = "current"
churn_class = "low"
embedding = "embedded"
ttl_seconds = 120
read_route = "gt canonical-terms list"
mutation_route = "gt canonical-terms"
recovery_route = "gt canonical-terms list"
applicability = ["*"]
projection = "descriptor"
token_cost = 600
priority = 100
essential = true

