# Harness projection profiles - GT-KB neutral baseline projection framework
#
# Bridge: gtkb-baseline-correction-and-goose-projector-slice-1 (GO at -004).
# Spec: GOV-HARNESS-NEUTRAL-BASELINE-001 (obligations 2, 4, 5); owner ruling
# D15/D34 (2026-09-19, M15 rulings R1-R15): a projection is the minimum a host's
# limitation requires - registrations and pointers only, never copies.
#
# Each [harnesses.<name>] table is the ONLY artifact aware of the difference
# between that harness's configuration surface and the neutral baseline
# (obligation 4). The projection engine (project_harness.py) reads this file
# and the baseline; it contains no per-harness branches of its own beyond the
# renderer classes declared here.

schema_version = 1

[baseline]
root = ".harness-baseline-configuration"
# The one skills source (D15: the tree moved out of the baseline directory).
# Hosts that discover this directory natively read it; the others receive
# pointer stubs (skills_discovery below).
skills_root = ".agents/skills"
# Hook scripts run in place from the baseline; registrations name this path.
hooks_root = ".harness-baseline-configuration/hooks"
hook_manifest = "hooks/manifest.toml"
# Rules are read on demand from <root>/rules by every host; nothing projects them.

# Tracked, hand-maintained root pointer files (R1 option B). They are NOT
# projector output: the projector never writes outside a config_dir. The
# acceptance checker pins existence, regular-file status and exact bytes
# (declared_pointer_drift). The root AGENTS.md is the moved baseline
# instruction file, tracked source, not listed here.
[root_pointers]
"CLAUDE.md" = "@AGENTS.md\n"
".goosehints" = "Follow ./AGENTS.md (GT-KB session instructions). This file is only a pointer; do not add guidance here.\n"

[stamp]
# Obligation 5: every projected artifact declares it is not canonical.
# Rendered in syntax valid for the file type; for files with YAML
# frontmatter the stamp is placed AFTER the closing delimiter.
text = """THIS FILE IS A PROJECTION, NOT CANONICAL.
Projected from the neutral harness baseline by the GT-KB projection engine.
Do not edit here: change the baseline ({baseline_root}) and re-project with
`gt harness project {harness}`. If a needed change cannot be made through
the baseline and re-projection, file a work item against the projector
(GOV-HARNESS-NEUTRAL-BASELINE-001 obligation 6)."""

[harnesses.goose]
config_dir = ".goose"
project_dir_var = "GOOSE_PROJECT_DIR"
# Native .agents/skills discovery UNCONFIRMED (M13 Q0.4): pointer stubs until
# the goose Q0.4 evidence file exists; then flip to "agents_skills" and drop
# skills_stub_dir.
skills_discovery = "pointer_stubs"
skills_stub_dir = ".goose/skills"
hooks_projection = "plugin_hooks_json"
# Goose-native hook registration: shell commands consuming JSON on stdin,
# registered at plugins/gtkb/hooks/hooks.json. Only PreToolUse and Stop can
# block; other events are registered non-blocking.
hooks_json_path = ".goose/plugins/gtkb/hooks/hooks.json"
# Projected copy of the retired implementation-start gate wrapper (owner ruling
# 2026-09-07, canon v8.92); the baseline source is gone, so the render no longer
# owns it and the engine removes it here.
leftover_paths = [".goose/hooks/implementation-start-gate.py"]
# Neutral lifecycle events -> Goose hook event names.
[harnesses.goose.hook_events]
pre_tool_use = "PreToolUse"
post_tool_use = "PostToolUse"
prompt_submit = "UserPromptSubmit"
session_start = "SessionStart"
turn_end = "Stop"
[harnesses.goose.blocking_events]
# Goose honors deny results only on these events.
supported = ["PreToolUse", "Stop"]

[harnesses.claude]
config_dir = ".claude"
project_dir_var = "CLAUDE_PROJECT_DIR"
# Native .agents/skills discovery UNCONFIRMED (M13 Q0.4): pointer stubs meanwhile.
skills_discovery = "pointer_stubs"
skills_stub_dir = ".claude/skills"
hooks_projection = "settings_json"
hooks_json_path = ".claude/settings.json"
# Stale surfaces from superseded projections. The engine deletes these on every
# render; apply_leftover_removes skips anything projector-owned, so this list can
# never remove a live file. Mirrors the [harnesses.cursor] leftover contract.
leftover_paths = [
  ".claude/AGENTS.md",
  ".claude/config.toml",
  ".claude/routing.toml",
  ".claude/hooks.json",
  ".claude/settings.json.rolegate-bak",
  ".claude/commands/registry.json",
  ".claude/rules/codex-dead-ends-and-false-positives.md",
  ".claude/rules/codex-decision-ledger.md",
  ".claude/rules/codex-knowledge-base-index.md",
  ".claude/rules/codex-loyal-opposition-runbook.md",
  ".claude/rules/codex-review-checklists.md",
  ".claude/rules/codex-review-gate.md",
  ".claude/rules/codex-review-operating-contract.md",
  ".claude/rules/codex-session-bootstrap.md",
  ".claude/rules/codex-standing-priorities.md",
  ".claude/rules/codex-way-of-working.md",
  ".claude/rules/gtkb-loyal-opposition.mdc",
  ".claude/rules/gtkb-prime-builder.mdc",
  ".claude/hooks/implementation-start-gate.py",
  # This retired generated skill also occurs without a previous manifest.
  # Remove its known file, preserving any other files in the skill directory.
  ".claude/skills/gtkb-check-deliberations/SKILL.md",
  ".claude/hooks/advisory-router-scan.py",
]
leftover_trees = [".claude/gtkb-hooks"]
[harnesses.claude.hook_events]
pre_tool_use = "PreToolUse"
post_tool_use = "PostToolUse"
prompt_submit = "UserPromptSubmit"
session_start = "SessionStart"
turn_end = "Stop"
[harnesses.claude.intent_matchers]
# Neutral intents -> native tool-matcher vocabulary.
file_write = "Write|Edit|MultiEdit|NotebookEdit|Delete|Move|Copy"
shell_exec = "Bash|PowerShell"
read_access = "Read|Grep|Glob"
all = ""

# Remaining harnesses are declared as placeholders so the roster lives HERE
# (not in the baseline). Their surface details land with their own projector
# slices (Phase D of the parent bridge thread).
[harnesses.codex]
config_dir = ".codex"
project_dir_var = "CODEX_PROJECT_DIR"
# Owner ruling R14 (a): Codex discovers .agents/skills natively (2026-09-10
# observation, interim pin; M13 Q0.1 records the version string). No stub
# tree is rendered. Fallback if Q0.4 fails for the pinned version:
#   skills_discovery = "pointer_stubs"
#   skills_stub_dir = ".codex/skills"
skills_discovery = "agents_skills"
hooks_projection = "native_cwd_hooks_json"
hooks_json_path = ".codex/hooks.json"
stdin_adapter = "scripts/codex_hook_adapter.py"
# Native runtime settings are adaptation source here, never read back from a
# generated target to derive the next projection. Values retain the existing
# GT-KB project defaults; host policy and explicit runtime overrides still apply.
config_toml = '''
# Project runtime defaults; native hooks are registered in this target's hooks.json.
approval_policy = "on-request"
sandbox_mode = "danger-full-access"

[features]
hooks = true
shell_snapshot = false

# This setting applies to workspace-write mode. It does not establish that
# networking is disabled under the danger-full-access mode above.
[sandbox_workspace_write]
network_access = false
'''
# Exact retired generated files: the implementation gate wrapper, the empty
# obsolete command registry and the old plugin registration pointing into Goose.
# Preserve neighboring files. config.toml is now derived from the profile above.
leftover_paths = [
  ".codex/hooks/implementation-start-gate.py",
  ".codex/commands/registry.json",
  ".codex/plugins/gtkb/hooks/hooks.json",
]
[harnesses.codex.hook_events]
pre_tool_use = "PreToolUse"
post_tool_use = "PostToolUse"
prompt_submit = "UserPromptSubmit"
session_start = "SessionStart"
turn_end = "Stop"
[harnesses.codex.intent_matchers]
# Native apply_patch is also matched by the host's Edit/Write aliases. Register
# its actual tool name once, with Bash for the native unified exec path.
file_write = "apply_patch"
shell_exec = "Bash"
read_access = "Read|Grep|Glob"
all = ""
[harnesses.cursor]
config_dir = ".cursor"
project_dir_var = "CURSOR_PROJECT_DIR"
# Native .agents/skills discovery UNCONFIRMED (M13 Q0.4): pointer stubs meanwhile.
skills_discovery = "pointer_stubs"
skills_stub_dir = ".cursor/skills"
hooks_projection = "hooks_json"
hooks_json_path = ".cursor/hooks.json"
stdin_adapter = "scripts/cursor_hook_adapter.py"
windowless_hooks = false
hook_timeout_floor_seconds = 30
fail_closed_on_blocking = true
leftover_paths = [
  ".cursor/settings.json",
  ".cursor/settings.json.rolegate-bak",
  ".cursor/config.toml",
  ".cursor/commands/registry.json",
  ".cursor/hooks.json.off",
  ".cursor/hooks.json.disabled",
  ".cursor/hooks/implementation-start-gate.py",
]
leftover_trees = [".cursor/gtkb-hooks"]
[harnesses.cursor.hook_events]
pre_tool_use = "preToolUse"
post_tool_use = "postToolUse"
prompt_submit = "beforeSubmitPrompt"
session_start = "sessionStart"
turn_end = "stop"
[harnesses.cursor.fail_closed_events]
supported = ["preToolUse", "beforeSubmitPrompt", "stop", "beforeShellExecution"]
[harnesses.cursor.intent_matchers]
file_write = "Write|StrReplace|Edit|MultiEdit|Delete"
shell_exec = "Shell|Bash"
read_access = "Read|Grep|Glob"
all = ""
[harnesses.antigravity]
config_dir = ".agent"
project_dir_var = "ANTIGRAVITY_PROJECT_DIR"
# Native .agents/skills discovery UNCONFIRMED (M13 Q0.4): pointer stubs meanwhile.
skills_discovery = "pointer_stubs"
skills_stub_dir = ".agent/skills"
hooks_projection = "antigravity_hooks_json"
hooks_json_path = ".agent/hooks.json"
stdin_adapter = "scripts/antigravity_hook_adapter.py"
windowless_hooks = true
# Projected copy of the retired implementation-start gate wrapper (owner ruling
# 2026-09-07, canon v8.92).
leftover_paths = [".agent/hooks/implementation-start-gate.py"]
# Owner ruling R14 (b) / R4: the host's read of the root AGENTS.md is UNCONFIRMED
# (context.fileName is a host-side setting; M13 host action). One projector-
# rendered one-line pointer in the host's own rules directory carries the
# instruction pointer until the antigravity Q0.2 evidence file exists; then this
# table is emptied and the file leaves through the ownership manifest. Values are
# exact bytes (no stamp); paths are relative to config_dir; classified POINTER.
[harnesses.antigravity.pointer_files]
"rules/gtkb-pointer.md" = "Follow ./AGENTS.md (GT-KB session instructions). This file is only a pointer; do not add guidance here.\n"
[harnesses.antigravity.hook_events]
pre_tool_use = "PreToolUse"
post_tool_use = "PostToolUse"
turn_end = "Stop"
# Native invocation events are not session-start or user-prompt events.
# Unmapped baseline obligations remain projector gaps until reconciled.
[harnesses.antigravity.intent_matchers]
file_write = "write_to_file|replace_file_content|multi_replace_file_content"
shell_exec = "run_command"
read_access = "view_file|list_dir|find_by_name|grep_search"
all = ""
# Each provider has an independent generated configuration. GT-KB is the
# runtime for these three profiles: the launchers read .agents/skills and the
# baseline hooks directly (skills_discovery = "agents_skills", no stub tree).
[harnesses.ollama]
config_dir = ".api-harness/ollama"
project_dir_var = "GTKB_PROJECT_ROOT"
skills_discovery = "agents_skills"
# Routing is read directly from the baseline; settings.json is the native hook registration.
hooks_projection = "settings_json"
hooks_json_path = ".api-harness/ollama/settings.json"

[harnesses.ollama.hook_events]
pre_tool_use = "PreToolUse"
post_tool_use = "PostToolUse"
prompt_submit = "UserPromptSubmit"
session_start = "SessionStart"
turn_end = "Stop"

[harnesses.ollama.intent_matchers]
file_write = "Write|Edit"
shell_exec = "Bash"
read_access = "Read|Grep|Glob"
all = ""

