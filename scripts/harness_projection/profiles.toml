# Harness projection profiles - GT-KB neutral baseline projection framework
#
# Bridge: gtkb-baseline-correction-and-goose-projector-slice-1 (GO at -004).
# Spec: GOV-HARNESS-NEUTRAL-BASELINE-001 (obligations 2, 4, 5).
#
# Each [harnesses.<name>] table is the ONLY artifact aware of the difference
# between that harness's configuration surface and the neutral baseline
# (obligation 4). The projection engine (project_harness.py) reads this file
# and the baseline; it contains no per-harness branches of its own beyond the
# renderer classes declared here.

schema_version = 1

[baseline]
root = ".harness-baseline-configuration"
# Neutral tokens the engine substitutes per harness. A token appearing in a
# baseline file and NOT declared in a profile is a projection error (fail
# closed), never silently passed through.
tokens = [
    "HARNESS_CONFIG_DIR",
    "HARNESS_SKILLS_DIR",
    "HARNESS_RULES_DIR",
    "HARNESS_HOOKS_DIR",
    "HARNESS_PROJECT_DIR_VAR",
    "HARNESS_SESSION_ID_VAR",
    "HARNESS_NAME",
    "SHARED_HELPERS_DIR",
]
hook_manifest = "hooks/manifest.toml"
shared_helpers_dir = "scripts/skill-helpers"

# Rules the activity-envelope contract defers to `::open <activity>`.
# They are NOT projected into harness rules dirs, because those dirs
# auto-load wholesale -- projecting them would make the deferral advisory
# only. Consumers read them from the baseline on demand. Kept here rather
# than in config/agent-control (forbidden runtime dependency).
deferred_rules = [
    "standing-priorities.md",
    "way-of-working.md",
    "review-operating-contract.md",
    "loyal-opposition-runbook.md",
    "loyal-opposition-knowledge-base-index.md",
    "loyal-opposition-review-checklists.md",
    "groundtruth-kb-vision.md",
    "template-code-review.md",
    "template-decision-memo.md",
]

[stamp]
# Obligation 5: every projected artifact declares it is not canonical.
# Rendered in syntax valid for the file type; for files with YAML
# frontmatter the stamp is placed AFTER the closing delimiter.
text = """THIS FILE IS A PROJECTION, NOT CANONICAL.
Projected from the neutral harness baseline by the GT-KB projection engine.
Do not edit here: change the baseline ({baseline_root}) and re-project with
`gt harness project {harness}`. If a needed change cannot be made through
the baseline and re-projection, file a work item against the projector
(GOV-HARNESS-NEUTRAL-BASELINE-001 obligation 6)."""

[harnesses.goose]
config_dir = ".goose"
skills_dir = ".goose/skills"
rules_dir = ".goose/rules"
hooks_dir = ".goose/hooks"
project_dir_var = "GOOSE_PROJECT_DIR"
session_id_var = "GOOSE_SESSION_ID"
# Full native skill bodies per owner decision (Option A,
# DELIB-20260813-BASELINE-CLEANSE-AND-PROJECTOR-ARCHITECTURE): Goose loads
# SKILL.md directly with progressive disclosure.
skill_body = "full"
rules_projection = true
hooks_projection = "plugin_hooks_json"
# Goose-native hook registration: shell commands consuming JSON on stdin,
# registered at plugins/gtkb/hooks/hooks.json. Only PreToolUse and Stop can
# block; other events are registered non-blocking.
hooks_json_path = ".goose/plugins/gtkb/hooks/hooks.json"
manifest_generator = "scripts/generate_goose_manifest.py"
# Neutral lifecycle events -> Goose hook event names.
[harnesses.goose.hook_events]
pre_tool_use = "PreToolUse"
post_tool_use = "PostToolUse"
prompt_submit = "UserPromptSubmit"
session_start = "SessionStart"
turn_end = "Stop"
[harnesses.goose.blocking_events]
# Goose honors deny results only on these events.
supported = ["PreToolUse", "Stop"]

[harnesses.claude]
config_dir = ".claude"
skills_dir = ".claude/skills"
rules_dir = ".claude/rules"
hooks_dir = ".claude/hooks"
project_dir_var = "CLAUDE_PROJECT_DIR"
session_id_var = "CLAUDE_SESSION_ID"
skill_body = "full"
rules_projection = true
hooks_projection = "settings_json"
hooks_json_path = ".claude/settings.json"
# Stale surfaces from superseded projections. The engine deletes these on every
# render; apply_leftover_removes skips anything projector-owned, so this list can
# never remove a live file. Mirrors the [harnesses.cursor] leftover contract.
leftover_paths = [
  ".claude/AGENTS.md",
  ".claude/config.toml",
  ".claude/routing.toml",
  ".claude/hooks.json",
  ".claude/settings.json.rolegate-bak",
  ".claude/commands/registry.json",
  ".claude/rules/codex-dead-ends-and-false-positives.md",
  ".claude/rules/codex-decision-ledger.md",
  ".claude/rules/codex-knowledge-base-index.md",
  ".claude/rules/codex-loyal-opposition-runbook.md",
  ".claude/rules/codex-review-checklists.md",
  ".claude/rules/codex-review-gate.md",
  ".claude/rules/codex-review-operating-contract.md",
  ".claude/rules/codex-session-bootstrap.md",
  ".claude/rules/codex-standing-priorities.md",
  ".claude/rules/codex-way-of-working.md",
  ".claude/rules/gtkb-loyal-opposition.mdc",
  ".claude/rules/gtkb-prime-builder.mdc",
]
leftover_trees = [".claude/gtkb-hooks"]
[harnesses.claude.hook_events]
pre_tool_use = "PreToolUse"
post_tool_use = "PostToolUse"
prompt_submit = "UserPromptSubmit"
session_start = "SessionStart"
turn_end = "Stop"
[harnesses.claude.intent_matchers]
# Neutral intents -> native tool-matcher vocabulary.
file_write = "Write|Edit|MultiEdit|NotebookEdit|Delete|Move|Copy"
shell_exec = "Bash|PowerShell"
read_access = "Read|Grep|Glob"
all = ""

# Remaining harnesses are declared as placeholders so the roster lives HERE
# (not in the baseline). Their surface details land with their own projector
# slices (Phase D of the parent bridge thread).
[harnesses.codex]
config_dir = ".codex"
skills_dir = ".codex/skills"
rules_dir = ".codex/rules"
hooks_dir = ".codex/hooks"
project_dir_var = "CODEX_PROJECT_DIR"
session_id_var = "CODEX_SESSION_ID"
# Full native skill bodies, as for Antigravity and Goose.
skill_body = "full"
rules_projection = true
# No leftover_paths / leftover_trees are declared by this slice (WI-5960 Slice 1).
# .codex carries superseded residue -- hooks.json, routing.toml, config.toml,
# settings.json.rolegate-bak, commands/registry.json, plugins/, gtkb-hooks/ -- and
# also .codex/session/, which is LIVE runtime state of an active role-holding
# harness. Retiring residue is a deletion class that deserves its own evidence and
# owner visibility, exactly as WI-7112 kept baseline cleanup separate from the
# exclusion filter. Activation does not require it: the render is correct without
# deleting anything. Residue retirement belongs in its own governed change.
[harnesses.cursor]
config_dir = ".cursor"
skills_dir = ".cursor/skills"
rules_dir = ".cursor/rules"
hooks_dir = ".cursor/hooks"
project_dir_var = "CURSOR_PROJECT_DIR"
session_id_var = "CURSOR_SESSION_ID"
skill_body = "adapter_script"
rules_projection = true
hooks_projection = "hooks_json"
hooks_json_path = ".cursor/hooks.json"
adapter_generator = "scripts/generate_cursor_skill_adapters.py"
stdin_adapter = "scripts/cursor_hook_adapter.py"
windowless_hooks = false
hook_timeout_floor_seconds = 30
fail_closed_on_blocking = true
leftover_paths = [
  ".cursor/settings.json",
  ".cursor/settings.json.rolegate-bak",
  ".cursor/config.toml",
  ".cursor/commands/registry.json",
  ".cursor/hooks.json.off",
  ".cursor/hooks.json.disabled",
]
leftover_trees = [".cursor/gtkb-hooks"]
[harnesses.cursor.hook_events]
pre_tool_use = "preToolUse"
post_tool_use = "postToolUse"
prompt_submit = "beforeSubmitPrompt"
session_start = "sessionStart"
turn_end = "stop"
[harnesses.cursor.fail_closed_events]
supported = ["preToolUse", "beforeSubmitPrompt", "stop", "beforeShellExecution"]
[harnesses.cursor.intent_matchers]
file_write = "Write|StrReplace|Edit|MultiEdit|Delete"
shell_exec = "Shell|Bash"
read_access = "Read|Grep|Glob"
all = ""
[harnesses.antigravity]
config_dir = ".agent"
skills_dir = ".agent/skills"
rules_dir = ".agent/rules"
hooks_dir = ".agent/hooks"
project_dir_var = "ANTIGRAVITY_PROJECT_DIR"
session_id_var = "ANTIGRAVITY_SESSION_ID"
# Full native skill bodies, as for Goose: Antigravity loads SKILL.md directly.
skill_body = "full"
rules_projection = true
[harnesses.ollama]
config_dir = ".api-harness"
status = "profile_pending"
[harnesses.openrouter]
# WI-5960 Slice 2. Three registered identities -- ollama (D, suspended), openrouter
# (F, active), alibaba-cloud-studio (H, suspended) -- share this one projection
# surface. Only openrouter is active, so it is the renderer: activating more than
# one would collide, because each would substitute its own project_dir_var and
# session_id_var into the same files and overwrite the others' ownership manifest,
# whose path the engine derives from config_dir. Restoring H is tracked separately
# as WI-5231. Leftovers are deliberately not declared; see the codex slice for the
# same reasoning.
config_dir = ".api-harness"
skills_dir = ".api-harness/skills"
rules_dir = ".api-harness/rules"
hooks_dir = ".api-harness/hooks"
project_dir_var = "OPENROUTER_PROJECT_DIR"
session_id_var = "OPENROUTER_SESSION_ID"
skill_body = "full"
rules_projection = true
[harnesses.alibaba-cloud-studio]
config_dir = ".api-harness"
status = "profile_pending"
