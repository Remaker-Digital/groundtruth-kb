# Project-script hooks: scripts that live at the project scripts/ tree rather
# than the baseline hooks/ directory. The projector renders the interpreter
# and project-dir variable natively per harness; args are harness-neutral
# except where the projector substitutes {{HARNESS_NAME}}.

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "dispatch_blackbox_gate.py"
script_root = "project_scripts"
blocking = true
timeout_seconds = 5

[[hook]]
event = "post_tool_use"
intents = ["all"]
script = "registry_observation_hook.py"
script_root = "project_scripts"
blocking = false
timeout_seconds = 10

[[hook]]
event = "turn_end"
intents = ["all"]
script = "session_self_initialization.py"
script_root = "project_scripts"
args = ["--emit-wrapup", "--fast-hook", "--harness-name", "{{HARNESS_NAME}}"]
blocking = true
timeout_seconds = 60

[[hook]]
event = "turn_end"
intents = ["all"]
script = "advisory_grilling_gate_lint.py"
script_root = "project_scripts"
args = ["--stop-hook"]
blocking = true
timeout_seconds = 10

[[hook]]
event = "turn_end"
intents = ["all"]
script = "auto_finalize_sweep.py"
script_root = "project_scripts"
blocking = true
timeout_seconds = 15
