# Neutral hook-registration manifest - GT-KB harness baseline
#
# Rendered by the harness projector into each harness's native
# registration form (per-harness event names, matcher vocabulary,
# interpreter and path syntax). Scripts live in the baseline hooks/
# directory and are projected alongside this manifest.
#
# schema: [[hook]] event = neutral lifecycle event; intents = neutral
# tool-intent tokens; script = hook script basename under hooks/;
# blocking = whether the harness must honor a deny result;
# timeout_seconds = advisory execution bound.

schema_version = 1

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "spec-before-code.py"
blocking = true

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "kb-not-markdown.py"
blocking = true

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "destructive-gate.py"
blocking = true

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "credential-scan.py"
blocking = true

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "scanner-safe-writer.py"
blocking = true

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "document_author_provenance_gate.py"
blocking = true
timeout_seconds = 5

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "lo-file-safety-gate.py"
blocking = true
timeout_seconds = 5

# Session write isolation uses the shared native effect gate. The CLI resolves
# the current binding, registered checkout, exact artifact claim and scratch
# scope; missing identity or unavailable authority cannot imply permission.
[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "implementation_start_gate.py"
script_root = "project_scripts"
blocking = true
timeout_seconds = 15

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "directive-enforcement-adapter.py"
blocking = true
timeout_seconds = 5

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "bridge-proposal-wi-id-collision-gate.py"
blocking = true
timeout_seconds = 5

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "code-quality-baseline-proposal-check.py"
blocking = true
timeout_seconds = 5

[[hook]]
event = "pre_tool_use"
intents = ["read_access", "shell_exec"]
script = "sot-read-discipline.py"
blocking = true
timeout_seconds = 5

[[hook]]
event = "post_tool_use"
intents = ["all"]
script = "spec-event-surfacer.py"
blocking = false
timeout_seconds = 5

[[hook]]
event = "turn_end"
intents = ["all"]
script = "advisory-router-scan.py"
blocking = true
timeout_seconds = 10

[[hook]]
event = "pre_tool_use"
intents = ["file_write", "shell_exec"]
script = "dispatch_blackbox_gate.py"
script_root = "project_scripts"
blocking = true
timeout_seconds = 5

[[hook]]
event = "turn_end"
intents = ["all"]
script = "advisory_grilling_gate_lint.py"
script_root = "project_scripts"
args = ["--stop-hook"]
blocking = true
timeout_seconds = 10
