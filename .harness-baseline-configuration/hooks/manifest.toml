# Must run first among prompt_submit hooks: it writes the session-init binding
# that later gates (work-intent claim, implementation-start packet, verdict
# filing) resolve. Hook transport is non-blocking, but neither a recognized
# exact init that cannot bind nor a near-canonical init that binds nothing
# reports success: both emit a visible message, so a session never proceeds
# believing it declared a role it does not hold
# (WI-6499 / owner-authorized emergency repair 2026-08-16).
[[hook]]
event = "prompt_submit"
intents = ["all"]
script = "session-init-binding.py"
blocking = false
timeout_seconds = 5

[[hook]]
event = "prompt_submit"
intents = ["all"]
script = "workstream-focus.py"
blocking = false
timeout_seconds = 5

[[hook]]
event = "prompt_submit"
intents = ["all"]
script = "delib-search-gate.py"
blocking = false

