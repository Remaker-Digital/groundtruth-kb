# Canonical terminology configuration for gt project doctor.
# Profile-aware: the doctor selects the matching [config.profiles.<profile>]
# block based on the project's scaffold profile (groundtruth.toml :: [project].profile).
# © 2026 Remaker Digital, a DBA of VanDusen & Palmeter, LLC. All rights reserved.
#
# Canonical definitions are current records read through the native CLI
# (`gt terms`, `gt authority resolve`; GOV-GLOSSARY-AS-DA-READ-SURFACE-001).
# The projected primer teaches that route. The former prompt-file contract
# (required files, required startup terms, required primer terms) is retired:
# generated rule files and startup files are not glossary authorities.

[meta]
version = "2.0.0"

[config.profiles.local-only]
missing_severity = "ERROR"

[config.profiles.dual-agent]
missing_severity = "ERROR"

[config.profiles.dual-agent-webapp]
# Extends dual-agent; no webapp-specific additional terminology guidance.
extends = "dual-agent"
missing_severity = "ERROR"

[config.profiles.harness-memory]
# Opt-in profile for projects whose harness memory lives outside the project repository.
extends = "dual-agent"
memory_md_location = "harness"
missing_severity = "ERROR"

[config.defaults]
drift_severity = "WARN"
checked_trees = ["docs/", "templates/"]
ignore_paths = [
    "CLAUDE_ARCHIVE.md",
    "docs/archive/**",
    "archive/**",
    "bridge/**",
    "CHANGELOG.md",
]
# Projected primer that teaches the native retrieval route.
primer_path = ".harness-baseline-configuration/rules/canonical-terminology.md"
